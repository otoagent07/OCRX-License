<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCRX Lisans Paneli</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --accent:#1565c0; --accent2:#0d47a1; --bg:#eef2f7; --card:#ffffff;
    --ok:#2e7d32; --off:#9aa4b2; --danger:#c62828; --border:#d5dde8; --muted:#6b7480;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:#1a1f27}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
  input,select{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;width:100%}
  .btn{background:var(--accent);color:#fff}.btn:hover{background:var(--accent2)}
  .btn.ghost{background:#e8eef7;color:var(--accent2)}
  .btn.ok{background:var(--ok)}.btn.danger{background:var(--danger)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .wrap{max-width:1080px;margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:0 0 4px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.on{background:#e6f4ea;color:var(--ok)}.pill.off{background:#eef1f5;color:var(--off)}
  .pill.exp{background:#fdecea;color:var(--danger)}
  .topbar{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .topbar h1{margin:0;font-size:20px;letter-spacing:.5px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{background:#e3eefc;color:var(--accent2)}.tab.active{background:var(--accent);color:#fff}
  .muted{color:var(--muted)}.right{margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 16px;border-radius:10px;opacity:.95;font-size:14px;max-width:340px}
  .login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1565c0,#0d47a1)}
  .login-card{background:#fff;border-radius:16px;padding:32px;width:360px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .logo{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto 14px}
  .err{color:var(--danger);font-size:13px;margin-top:8px;font-weight:600}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  code{background:#eef2f7;padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

// ---- Sabit yapilandirma ----
const OWNER="otoagent07", REPO="OCRX-License", FILE="licenses.json", BRANCH="main";
const ADMIN_USER="rmos", ADMIN_PASS="ocrx";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const POOL_REPO="OCRX-Pool", POOL_FILE="pool.json";
const POOL_API=`https://api.github.com/repos/${OWNER}/${POOL_REPO}/contents/${POOL_FILE}`;

// ---- yardimcilar ----
const todayStr=()=>new Date().toISOString().slice(0,10);
const plusYears=(n)=>{const d=new Date();d.setFullYear(d.getFullYear()+n);return d.toISOString().slice(0,10)};
const normKey=(k)=>(k||"").trim().toUpperCase();
const b64encode=(s)=>btoa(unescape(encodeURIComponent(s)));
const b64decode=(s)=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const uid=()=>Math.random().toString(36).slice(2,9);

function deviceStatus(d){
  if(!d.active) return {cls:"off",txt:"Pasif"};
  if(d.end && d.end < todayStr()) return {cls:"exp",txt:"Suresi doldu"};
  return {cls:"on",txt:"Aktif"};
}

// ---- GitHub okuma/yazma ----
async function ghLoad(token){
  const headers={"Accept":"application/vnd.github+json"};
  if(token) headers.Authorization=`Bearer ${token}`;
  const r=await fetch(API+`?ref=${BRANCH}&t=`+Date.now(),{headers});
  if(r.status===404) return {data:{hotels:[],devices:[]},sha:null};
  if(!r.ok) throw new Error("GitHub okuma hatasi: "+r.status);
  const j=await r.json();
  return {data:JSON.parse(b64decode(j.content)),sha:j.sha};
}
async function ghSave(token,data,sha){
  const body={message:"lisans guncelleme",branch:BRANCH,
    content:b64encode(JSON.stringify(data,null,2))};
  if(sha) body.sha=sha;
  const r=await fetch(API,{method:"PUT",
    headers:{Authorization:`Bearer ${token}`,"Accept":"application/vnd.github+json"},
    body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||("Kaydetme hatasi "+r.status));}
  return (await r.json()).content.sha;
}

// ---- Havuz (OCRX-Pool/pool.json) okuma/yazma ----
// Cihazlar lisanssizken kendilerini buraya yazar; panel listeler, otele ekler,
// gereksizleri siler. Okuma token'siz de calisir (depo public).
async function poolLoad(token){
  const headers={"Accept":"application/vnd.github+json"};
  if(token) headers.Authorization=`Bearer ${token}`;
  const r=await fetch(POOL_API+`?ref=${BRANCH}&t=`+Date.now(),{headers});
  if(r.status===404) return {devices:[],sha:null};
  if(!r.ok) throw new Error("Havuz okuma hatasi: "+r.status);
  const j=await r.json();
  let d={}; try{d=JSON.parse(b64decode(j.content));}catch(e){d={};}
  return {devices:Array.isArray(d.devices)?d.devices:[],sha:j.sha};
}
async function poolSave(token,devices,sha){
  const body={message:"havuz guncelleme",branch:BRANCH,
    content:b64encode(JSON.stringify({devices},null,2))};
  if(sha) body.sha=sha;
  const r=await fetch(POOL_API,{method:"PUT",
    headers:{Authorization:`Bearer ${token}`,"Accept":"application/vnd.github+json"},
    body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||("Havuz kaydetme hatasi "+r.status));}
  return (await r.json()).content.sha;
}

// ================= UYGULAMA =================
function App(){
  const [authed,setAuthed]=useState(sessionStorage.getItem("ocrx_admin")==="1");
  if(!authed) return <Login onOk={()=>setAuthed(true)} />;
  return <Panel onLogout={()=>{sessionStorage.removeItem("ocrx_admin");setAuthed(false);}} />;
}

function Login({onOk}){
  const [u,setU]=useState(""),[p,setP]=useState(""),[e,setE]=useState("");
  const go=()=>{ if(u===ADMIN_USER&&p===ADMIN_PASS){sessionStorage.setItem("ocrx_admin","1");onOk();}
    else setE("Kullanici adi veya sifre hatali."); };
  return <div className="login-bg"><div className="login-card">
    <div className="logo">OCRX</div>
    <h2 style={{textAlign:"center",margin:"0 0 18px"}}>Lisans Paneli</h2>
    <label>Kullanici Adi</label>
    <input value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} />
    <div style={{height:12}}/>
    <label>Sifre</label>
    <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} />
    {e&&<div className="err">{e}</div>}
    <div style={{height:18}}/>
    <button className="btn" style={{width:"100%"}} onClick={go}>Giris Yap</button>
  </div></div>;
}

function Panel({onLogout}){
  const [token,setToken]=useState(localStorage.getItem("ocrx_gh_token")||"");
  const [data,setData]=useState({hotels:[],devices:[]});
  const [sha,setSha]=useState(null);
  const [tab,setTab]=useState("devices");
  const [hotelDevices,setHotelDevices]=useState(null); // Oteller>Cihazlar gorunumu
  const [poolToken,setPoolToken]=useState(localStorage.getItem("ocrx_pool_token")||"");
  const [pool,setPool]=useState({devices:[],sha:null});
  const [toast,setToast]=useState("");
  const [pending,setPending]=useState(null); // havuzdan "Otele ekle" ile gelen cihaz
  const [loading,setLoading]=useState(true);
  const notify=(m)=>{setToast(m);setTimeout(()=>setToast(""),2600);};

  const reload=async()=>{ setLoading(true);
    try{const {data,sha}=await ghLoad(token);setData(data);setSha(sha);}
    catch(e){notify(e.message);}
    // Havuz okumasi bagimsizdir: hata verse de panel calismaya devam eder.
    try{setPool(await poolLoad(poolToken||token));}catch(e){}
    setLoading(false); };
  useEffect(()=>{reload();},[]);

  const persist=async(next)=>{
    if(!token){notify("Once Ayarlar'dan GitHub token girin (kaydetmek icin).");return;}
    try{const nsha=await ghSave(token,next,sha);setData(next);setSha(nsha);notify("Kaydedildi.");}
    catch(e){notify(e.message);}
  };

  // Havuzdan kayit silme (elle temizlik + otele eklenince otomatik dusurme).
  const poolRemove=async(keys,silent)=>{
    const tok=poolToken||token;
    const set=new Set(keys.map(normKey));
    const left=pool.devices.filter(d=>!set.has(normKey(d.key)));
    if(left.length===pool.devices.length) return;
    if(!tok){ if(!silent) notify("Havuzdan silmek icin Ayarlar'dan token girin."); return; }
    try{ const nsha=await poolSave(tok,left,pool.sha); setPool({devices:left,sha:nsha});
         if(!silent) notify("Havuzdan silindi."); }
    catch(e){ if(!silent) notify(e.message); }
  };

  return <div className="wrap">
    <div className="topbar">
      <h1>🔐 OCRX Lisans Paneli</h1>
      <div className="row">
        <span style={{opacity:.9,fontSize:13}}>{token?"● token tanimli":"○ token yok (salt-okunur)"}</span>
        <button className="btn ghost sm" onClick={reload}>Yenile</button>
        <button className="btn ghost sm" onClick={onLogout}>Cikis</button>
      </div>
    </div>

    <div className="tabs">
      <button className={"btn tab"+(tab==="devices"?" active":"")} onClick={()=>setTab("devices")}>Cihazlar</button>
      <button className={"btn tab"+(tab==="hotels"?" active":"")} onClick={()=>setTab("hotels")}>Oteller</button>
      <button className={"btn tab"+(tab==="pool"?" active":"")} onClick={()=>setTab("pool")}>Havuz{pool.devices.length?` (${pool.devices.length})`:""}</button>
      <button className={"btn tab"+(tab==="settings"?" active":"")} onClick={()=>setTab("settings")}>Ayarlar</button>
    </div>

    {loading? <div className="card">Yukleniyor…</div> :
      tab==="hotels"? (hotelDevices
        ? <Devices data={data} onChange={persist} notify={notify}
                   pool={pool.devices} onPoolConsume={poolRemove}
                   lockedHotelId={hotelDevices} onBack={()=>setHotelDevices(null)}/>
        : <Hotels data={data} onChange={persist} notify={notify}
                  onOpenDevices={setHotelDevices}/>) :
      tab==="devices"? <Devices data={data} onChange={persist} notify={notify}
                                pool={pool.devices} onPoolConsume={poolRemove}
                                pending={pending} onPendingUsed={()=>setPending(null)}/> :
      tab==="pool"? <Pool pool={pool.devices} hotels={data.hotels} notify={notify}
                          onRemove={poolRemove} onAdd={(dev)=>{setTab("devices");setPending(dev);}}
                          reload={reload}/> :
      <Settings token={token} setToken={(t)=>{setToken(t);localStorage.setItem("ocrx_gh_token",t);}}
                poolToken={poolToken}
                setPoolToken={(t)=>{setPoolToken(t);localStorage.setItem("ocrx_pool_token",t);}}
                reload={reload}/>}

    {toast&&<div className="toast">{toast}</div>}
  </div>;
}

// ---------------- OTELLER ----------------
function Hotels({data,onChange,notify,onOpenDevices}){
  const [name,setName]=useState("");
  const add=()=>{ const n=name.trim(); if(!n)return;
    if(data.hotels.some(h=>h.name.toLowerCase()===n.toLowerCase())){notify("Bu otel zaten var.");return;}
    onChange({...data,hotels:[...data.hotels,{id:uid(),name:n}]}); setName(""); };
  const rename=(id)=>{ const h=data.hotels.find(x=>x.id===id); const v=prompt("Otel adi:",h.name);
    if(v&&v.trim()) onChange({...data,hotels:data.hotels.map(x=>x.id===id?{...x,name:v.trim()}:x)}); };
  const del=(id)=>{ const cnt=data.devices.filter(d=>d.hotelId===id).length;
    if(!confirm(cnt?`Bu otelde ${cnt} cihaz var. Otel silinsin mi? (cihazlar otelsiz kalir)`:"Otel silinsin mi?"))return;
    onChange({...data,hotels:data.hotels.filter(x=>x.id!==id),
      devices:data.devices.map(d=>d.hotelId===id?{...d,hotelId:null}:d)}); };
  return <div className="card">
    <h3 style={{marginTop:0}}>Oteller</h3>
    <div className="row" style={{marginBottom:14}}>
      <div style={{flex:1,minWidth:220}}><input placeholder="Yeni otel adi" value={name}
        onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/></div>
      <button className="btn ok" onClick={add}>+ Otel Ekle</button>
    </div>
    <table><thead><tr><th>Otel</th><th>Cihaz</th><th className="right" style={{textAlign:"right"}}>Islem</th></tr></thead>
      <tbody>{data.hotels.length===0&&<tr><td colSpan="3" className="muted">Henuz otel yok.</td></tr>}
        {data.hotels.map(h=>{const c=data.devices.filter(d=>d.hotelId===h.id).length;
          return <tr key={h.id}><td><b>{h.name}</b></td><td>{c}</td>
            <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
              <button className="btn sm" onClick={()=>onOpenDevices(h.id)}>Cihazlar ({c})</button>{" "}
              <button className="btn ghost sm" onClick={()=>rename(h.id)}>Duzenle</button>{" "}
              <button className="btn danger sm" onClick={()=>del(h.id)}>Sil</button></td></tr>;})}
      </tbody></table>
  </div>;
}

// ---------------- CIHAZLAR ----------------
function Devices({data,onChange,notify,lockedHotelId,onBack,pool,onPoolConsume,pending,onPendingUsed}){
  const [q,setQ]=useState("");
  const [hf,setHf]=useState("all");
  const [form,setForm]=useState(null); // ekleme/duzenleme formu
  // Havuz sekmesinden "Otele ekle" ile gelindiyse formu dolu olarak ac.
  useEffect(()=>{ if(pending){ setForm(pending); onPendingUsed&&onPendingUsed(); } },[pending]);
  const hotelName=(id)=>data.hotels.find(h=>h.id===id)?.name||"—";
  // Oteller>Cihazlar gorunumu: otele kilitli (filtre gizli, yeni cihaz o otele).
  const effHf = lockedHotelId || hf;

  const filtered=useMemo(()=>data.devices.filter(d=>{
    if(effHf!=="all"&&d.hotelId!==effHf) return false;
    if(!q) return true; const s=q.toLowerCase();
    return (d.key||"").toLowerCase().includes(s)||(d.pcName||"").toLowerCase().includes(s)
      ||hotelName(d.hotelId).toLowerCase().includes(s);
  }),[data,q,effHf]);

  const save=(dev)=>{
    const key=normKey(dev.key);
    if(!key){notify("Gecerli KEY girin.");return;}
    const exists=data.devices.find(d=>d.key===key && d.id!==dev.id);
    if(exists){notify("Bu KEY zaten kayitli.");return;}
    const rec={...dev,key};
    const list=data.devices.some(d=>d.id===rec.id)
      ? data.devices.map(d=>d.id===rec.id?rec:d) : [...data.devices,rec];
    onChange({...data,devices:list}); setForm(null);
    // Otele eklenen cihaz havuzda bekliyorsa oradan otomatik dusulur.
    onPoolConsume&&onPoolConsume([key],true);
  };
  const toggle=(d)=>onChange({...data,devices:data.devices.map(x=>x.id===d.id?{...x,active:!x.active}:x)});
  const del=(d)=>{ if(confirm(`${d.pcName||d.key} silinsin mi?`))
    onChange({...data,devices:data.devices.filter(x=>x.id!==d.id)}); };

  return <div className="card">
    <div className="row" style={{marginBottom:14}}>
      {lockedHotelId&&<button className="btn ghost sm" onClick={onBack}>← Oteller</button>}
      <h3 style={{margin:0}}>{lockedHotelId? hotelName(lockedHotelId)+" — Cihazlar" : "Cihazlar"}</h3>
      <button className="btn ok right" onClick={()=>setForm({id:uid(),key:"",pcName:"",hotelId:lockedHotelId||data.hotels[0]?.id||null,active:false,start:todayStr(),end:plusYears(2)})}>+ Cihaz Ekle</button>
    </div>
    <div className="row" style={{marginBottom:12}}>
      <div style={{flex:1,minWidth:200}}><input placeholder="Ara: KEY, PC adi, otel…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      {!lockedHotelId&&<div style={{minWidth:180}}>
        <select value={hf} onChange={e=>setHf(e.target.value)}>
          <option value="all">Tum oteller</option>
          {data.hotels.map(h=><option key={h.id} value={h.id}>{h.name}</option>)}
        </select>
      </div>}
    </div>
    <div style={{overflowX:"auto"}}>
    <table><thead><tr>
      <th>Durum</th><th>KEY</th><th>PC Adi</th><th>Otel</th><th>Baslangic</th><th>Bitis</th><th style={{textAlign:"right"}}>Islem</th>
    </tr></thead><tbody>
      {filtered.length===0&&<tr><td colSpan="7" className="muted">Kayit yok.</td></tr>}
      {filtered.map(d=>{const s=deviceStatus(d);return <tr key={d.id}>
        <td><span className={"pill "+s.cls}>{s.txt}</span></td>
        <td><code>{d.key}</code></td><td>{d.pcName||"—"}</td><td>{hotelName(d.hotelId)}</td>
        <td>{d.start}</td><td>{d.end}</td>
        <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
          <button className={"btn sm "+(d.active?"ghost":"ok")} onClick={()=>toggle(d)}>{d.active?"Pasif yap":"Aktif et"}</button>{" "}
          <button className="btn ghost sm" onClick={()=>setForm({...d})}>Duzenle</button>{" "}
          <button className="btn danger sm" onClick={()=>del(d)}>Sil</button>
        </td></tr>;})}
    </tbody></table>
    </div>
    {form&&<DeviceForm form={form} hotels={data.hotels} pool={pool||[]}
                       onCancel={()=>setForm(null)} onSave={save}/>}
  </div>;
}

function DeviceForm({form,hotels,pool,onCancel,onSave}){
  const [f,setF]=useState(form);
  const [pick,setPick]=useState(false); // havuz secim listesi acik mi
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const fromPool=(d)=>{ setF(s=>({...s,key:normKey(d.key),pcName:d.pcName||""})); setPick(false); };
  return <div style={{position:"fixed",inset:0,background:"rgba(15,25,45,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
    <div className="card" style={{width:440,maxWidth:"92vw"}}>
      <h3 style={{marginTop:0}}>{form.key?"Cihaz Duzenle":"Cihaz Ekle"}</h3>
      <div className="row" style={{marginBottom:4}}>
        <label style={{margin:0}}>Cihaz Anahtarı (KEY)</label>
        <button className="btn ghost sm right" onClick={()=>setPick(v=>!v)}>
          Havuzdan çağır{(pool&&pool.length)?` (${pool.length})`:""}</button>
      </div>
      <input value={f.key} onChange={e=>set("key",e.target.value)} placeholder="XXXXX-XXXXX-XXXXX-XXXXX"/>
      {pick&&<div style={{border:"1px solid var(--border)",borderRadius:8,marginTop:8,
                          maxHeight:190,overflowY:"auto",background:"#fafcff"}}>
        {(!pool||pool.length===0)&&<div className="muted" style={{padding:10,fontSize:13}}>
          Havuzda bekleyen cihaz yok.</div>}
        {(pool||[]).map((d,i)=><div key={d.key+i} className="row"
            style={{padding:"8px 10px",borderBottom:"1px solid var(--border)",gap:8}}>
          <div style={{flex:1,minWidth:0}}>
            <div><b>{d.pcName||"—"}</b> <span className="muted" style={{fontSize:12}}>{d.ts||""}</span></div>
            <div><code style={{fontSize:12}}>{d.key}</code></div>
            {(d.user||d.dbId)&&<div className="muted" style={{fontSize:12}}>{d.user||""}{d.dbId?` · db ${d.dbId}`:""}</div>}
          </div>
          <button className="btn sm" onClick={()=>fromPool(d)}>Seç</button>
        </div>)}
      </div>}
      <div style={{height:10}}/>
      <label>PC Adi</label>
      <input value={f.pcName} onChange={e=>set("pcName",e.target.value)} placeholder="Bilgisayar adi"/>
      <div style={{height:10}}/>
      <label>Otel</label>
      <select value={f.hotelId||""} onChange={e=>set("hotelId",e.target.value||null)}>
        <option value="">— Otelsiz —</option>
        {hotels.map(h=><option key={h.id} value={h.id}>{h.name}</option>)}
      </select>
      <div style={{height:10}}/>
      <div className="grid">
        <div><label>Baslangic</label><input type="date" value={f.start} onChange={e=>set("start",e.target.value)}/></div>
        <div><label>Bitis</label><input type="date" value={f.end} onChange={e=>set("end",e.target.value)}/></div>
      </div>
      <div style={{height:12}}/>
      <label style={{display:"flex",alignItems:"center",gap:8,fontSize:14,color:"#1a1f27",fontWeight:700}}>
        <input type="checkbox" style={{width:"auto"}} checked={!!f.active} onChange={e=>set("active",e.target.checked)}/>
        Aktif (lisans calissin)
      </label>
      <div className="row" style={{marginTop:18,justifyContent:"flex-end"}}>
        <button className="btn ghost" onClick={onCancel}>Vazgec</button>
        <button className="btn ok" onClick={()=>onSave(f)}>Kaydet</button>
      </div>
    </div>
  </div>;
}

// ---------------- HAVUZ ----------------
// Lisanssiz cihazlar kendini buraya yazar (exe otomatik bildirir). Buradan
// otele eklenir ya da gereksiz kayitlar toplu silinir.
function Pool({pool,hotels,notify,onRemove,onAdd,reload}){
  const [sel,setSel]=useState({});
  const [q,setQ]=useState("");
  const list=useMemo(()=>pool.filter(d=>{
    if(!q) return true; const t=q.toLowerCase();
    return (d.key||"").toLowerCase().includes(t)||(d.pcName||"").toLowerCase().includes(t)
      ||(d.user||"").toLowerCase().includes(t);
  }),[pool,q]);
  const selKeys=Object.keys(sel).filter(k=>sel[k]);
  const toggle=(k)=>setSel(s=>({...s,[k]:!s[k]}));
  const allOn=list.length>0&&list.every(d=>sel[d.key]);
  const toggleAll=()=>{const n={...sel};list.forEach(d=>{n[d.key]=!allOn;});setSel(n);};
  const delSel=()=>{ if(!selKeys.length){notify("Önce kayıt seçin.");return;}
    if(!confirm(`${selKeys.length} kayıt havuzdan silinsin mi?`))return;
    onRemove(selKeys); setSel({}); };
  return <div className="card">
    <div className="row" style={{marginBottom:14}}>
      <h3 style={{margin:0}}>Havuz — Bekleyen Cihazlar</h3>
      <button className="btn ghost sm right" onClick={reload}>Yenile</button>
      <button className="btn danger sm" onClick={delSel}>Seçilenleri Sil</button>
    </div>
    <p className="muted" style={{fontSize:13,marginTop:0}}>
      Lisansı olmayan cihazlar kendilerini otomatik olarak buraya bildirir.
      "Otele Ekle" ile cihazı lisansa geçirin; kayıt havuzdan otomatik düşer.
    </p>
    <div className="row" style={{marginBottom:12}}>
      <div style={{flex:1,minWidth:200}}><input placeholder="Ara: KEY, PC adı, kullanıcı…"
        value={q} onChange={e=>setQ(e.target.value)}/></div>
    </div>
    <div style={{overflowX:"auto"}}>
    <table><thead><tr>
      <th style={{width:34}}><input type="checkbox" style={{width:"auto"}} checked={allOn} onChange={toggleAll}/></th>
      <th>PC Adı</th><th>KEY</th><th>Kullanıcı / DB</th><th>Sürüm</th><th>Son Görülme</th>
      <th style={{textAlign:"right"}}>İşlem</th>
    </tr></thead><tbody>
      {list.length===0&&<tr><td colSpan="7" className="muted">Havuzda bekleyen cihaz yok.</td></tr>}
      {list.map((d,i)=><tr key={d.key+i}>
        <td><input type="checkbox" style={{width:"auto"}} checked={!!sel[d.key]} onChange={()=>toggle(d.key)}/></td>
        <td><b>{d.pcName||"—"}</b></td><td><code>{d.key}</code></td>
        <td>{d.user||"—"}{d.dbId?` · ${d.dbId}`:""}</td><td>{d.version||"—"}</td><td>{d.ts||"—"}</td>
        <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
          <button className="btn ok sm" onClick={()=>onAdd({id:uid(),key:normKey(d.key),
            pcName:d.pcName||"",hotelId:hotels[0]?.id||null,active:true,
            start:todayStr(),end:plusYears(2)})}>Otele Ekle</button>{" "}
          <button className="btn danger sm" onClick={()=>{ if(confirm(`${d.pcName||d.key} havuzdan silinsin mi?`)) onRemove([d.key]); }}>Sil</button>
        </td></tr>)}
    </tbody></table>
    </div>
  </div>;
}

// ---------------- AYARLAR ----------------
function Settings({token,setToken,poolToken,setPoolToken,reload}){
  const [t,setT]=useState(token);
  const [pt,setPt]=useState(poolToken||"");
  return <div className="card">
    <h3 style={{marginTop:0}}>Ayarlar — GitHub Token</h3>
    <p className="muted" style={{fontSize:14}}>
      Kaydetme/guncelleme yapabilmek icin <b>{OWNER}/{REPO}</b> deposunda <code>Contents: Read and write</code>
      yetkili bir <b>fine-grained token</b> gerekir. Token yalnizca bu tarayicida (localStorage) saklanir,
      hicbir yere gonderilmez. Salt-okuma (listeleme) token'siz de calisir.
    </p>
    <label>GitHub Personal Access Token</label>
    <input type="password" value={t} onChange={e=>setT(e.target.value)} placeholder="github_pat_…"/>
    <div className="row" style={{marginTop:14}}>
      <button className="btn ok" onClick={()=>{setToken(t.trim());reload();}}>Kaydet</button>
      {token&&<button className="btn ghost" onClick={()=>{setToken("");}}>Temizle</button>}
    </div>
    <hr style={{border:"none",borderTop:"1px solid var(--border)",margin:"22px 0"}}/>
    <h3 style={{marginTop:0}}>Havuz Token (isteğe bağlı)</h3>
    <p className="muted" style={{fontSize:14}}>
      Havuz kayıtlarını <b>silmek</b> için <b>{OWNER}/{POOL_REPO}</b> deposunda
      <code>Contents: Read and write</code> yetkili token gerekir. Boş bırakılırsa
      yukarıdaki token kullanılır. Havuzu <b>okumak</b> token'siz de çalışır.
    </p>
    <label>Havuz Token</label>
    <input type="password" value={pt} onChange={e=>setPt(e.target.value)} placeholder="github_pat_…"/>
    <div className="row" style={{marginTop:14}}>
      <button className="btn ok" onClick={()=>{setPoolToken(pt.trim());reload();}}>Kaydet</button>
      {poolToken&&<button className="btn ghost" onClick={()=>{setPoolToken("");setPt("");}}>Temizle</button>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
